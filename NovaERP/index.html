<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <meta name="description" content="Nova Electronics Manufacturing & Distribution ERP System" />
    <title>NovaERP — Electronics Manufacturing & Distribution</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Monkey patch removeChild to prevent React 18 from crashing when third-party scripts (like Google OAuth) modify the DOM
      const originalRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function(child) {
        if (child.parentNode !== this) {
          console.warn("Ignored React removeChild error caused by third-party DOM mutation.");
          return child;
        }
        return originalRemoveChild.apply(this, arguments);
      };

      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;white-space:pre-wrap;font-family:monospace;"><b>Global Error:</b><br/>' + event.error?.stack + '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;white-space:pre-wrap;font-family:monospace;"><b>Unhandled Promise Rejection:</b><br/>' + event.reason?.stack + '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
